<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EHP Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* The shop window: search + class tabs on top, stat rail on the left, item rows in the middle,
   item detail on the right, sell / undo / inventory / gold along the bottom. Same anatomy as the in-game shop. */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;height:min(900px,calc(100dvh - 120px));min-height:560px}
.shop-head{grid-column:1;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px}
.search:focus-within{border-color:var(--line2);background:var(--s3)}
.search svg{width:18px;height:18px;color:var(--t3);flex:none}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;padding:8px 0;font-size:13.5px;color:var(--t1)}
.search input::placeholder{color:var(--t4)}
.search kbd{font:inherit;font-size:12px;color:var(--t4);border:1px solid var(--line2);border-radius:6px;padding:0 6px}
.classes{display:flex;align-items:center;gap:8px}
.classes .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
.classes .seg button{padding:5px 11px;font-size:12.5px}
.sort{margin-left:auto;width:34px;height:34px;padding:0;justify-content:center;border-radius:50%;flex:none;background:var(--s2);border:1px solid var(--line)}
.sort svg{transition:transform .2s}
.sort[aria-pressed="true"] svg{transform:scaleY(-1)}

.shop-body{grid-column:1;display:grid;grid-template-columns:48px minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rail hr{width:24px;border:none;border-top:1px solid var(--line2);margin:6px 0}
.fbtn{width:34px;height:34px;padding:4px;border:none;border-radius:var(--r-sm);background:none;display:grid;place-items:center;flex:none}
.fbtn img{width:24px;height:24px;border-radius:var(--r-xs);filter:grayscale(1) brightness(.8) contrast(1.1);transition:filter .15s}
.fbtn:hover img{filter:grayscale(.2) brightness(1)}
.fbtn[aria-pressed="true"]{background:var(--s4)}
.fbtn[aria-pressed="true"] img{filter:none}
.fbtn.clear{color:var(--t3)}
.fbtn.clear svg{width:20px;height:20px}
.fbtn.clear:disabled{color:var(--t4);cursor:default}

.grid{overflow-y:auto;padding:2px 14px 20px;min-width:0;scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
.sec{padding-top:12px}
.sec h2{font-size:13.5px;font-weight:500;color:var(--t1);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.sec h2 span{font-size:12px;color:var(--t4);font-weight:400}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:8px 6px}
.it{width:48px;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:var(--r-sm)}
.it .ic{width:42px;height:42px;border-radius:var(--r-xs);display:block;position:relative;background:#000;box-shadow:0 0 0 1px var(--line2);transition:box-shadow .12s,transform .12s}
.it .ic img{width:100%;height:100%;display:block;border-radius:inherit}
.it .g{font-size:11.5px;color:var(--t2);font-weight:400}
.it:hover .ic{box-shadow:0 0 0 2px var(--t3);transform:translateY(-1px)}
.it.sel .ic{box-shadow:0 0 0 2px var(--t1),0 6px 20px rgba(0,0,0,.6)}
.it.sel .g{color:var(--t1)}
.it.owned .ic::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--s1)}
.it.blocked .ic img{filter:grayscale(.7) brightness(.6)}
.it.blocked .g{color:var(--t4)}
.it:focus-visible{outline-offset:4px}
.empty{color:var(--t3);padding:40px 4px}

/* detail */
.detail{grid-column:2;grid-row:1 / 4;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--s1)}
.into-wrap{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.into-wrap h3,.d-sub{font-size:12px;color:var(--t3);font-weight:400;margin:0 0 8px}
.into{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.into > *{aspect-ratio:1;border-radius:var(--r-xs);background:var(--s2);border:1px solid var(--line);padding:0;display:block;overflow:hidden}
.into button:hover{border-color:var(--t3)}
.into img{width:100%;height:100%;display:block}
.d-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
.d-empty{color:var(--t3);margin:auto 0;text-align:center;padding:0 12px}
.tree{display:flex;justify-content:center;padding:4px 0}
.node{display:flex;flex-direction:column;align-items:center;position:relative}
.nb{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.nb img{width:32px;height:32px;border-radius:var(--r-xs);display:block;box-shadow:0 0 0 1px var(--line2)}
.nb.root img{width:42px;height:42px;border-radius:var(--r-sm);box-shadow:0 0 0 2px var(--t2)}
.nb.have img{box-shadow:0 0 0 2px var(--gold)}
.nb:hover img{box-shadow:0 0 0 2px var(--t3)}
.nb span{font-size:10.5px;color:var(--t3)}
.kids{display:flex;gap:8px;padding-top:16px;position:relative}
.kids::before{content:"";position:absolute;top:0;left:50%;height:8px;border-left:1px solid var(--t4)}
.kids>.node{padding-top:8px}
.kids>.node::before{content:"";position:absolute;top:0;left:0;right:0;border-top:1px solid var(--t4)}
.kids>.node:first-child::before{left:50%}
.kids>.node:last-child::before{right:50%}
.kids>.node:only-child::before{display:none}
.kids>.node::after{content:"";position:absolute;top:0;left:50%;height:8px;border-left:1px solid var(--t4)}
.d-name{font-size:17px;font-weight:500;color:var(--t1);letter-spacing:-.01em;line-height:1.2}
.d-cost{display:flex;gap:12px;align-items:baseline;margin-top:4px;font-size:13.5px;color:var(--gold);font-weight:450}
.d-cost s{color:var(--t4);font-size:13px}
.d-cost .sellv{color:var(--t3);font-size:13px;font-weight:350}
.d-desc{font-size:12.5px;color:var(--t2);line-height:1.55}
.buybar{padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.purchase{width:100%;justify-content:center;padding:9px 14px;font-size:13.5px;font-weight:500;background:linear-gradient(180deg,#2a2418,#1d1a13);border-color:var(--gold-d);color:var(--gold)}
.purchase:hover:not(:disabled){background:linear-gradient(180deg,#352c1b,#241f15);border-color:var(--gold)}
.purchase:disabled{border-color:var(--line);background:var(--s2)}
.d-note{font-size:12.5px;color:var(--warn);min-height:1.2em;text-align:center}

/* bottom bar */
.shop-foot{grid-column:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--s1);flex-wrap:wrap}
.inv{display:flex;gap:6px;margin:0 auto;padding:0 8px}
.slot{width:40px;height:40px;border-radius:var(--r-sm);background:var(--s2);border:1px solid var(--line);padding:0;overflow:hidden;display:block}
.slot img{width:100%;height:100%;display:block}
.slot:not(:empty):hover{border-color:var(--t3)}
.slot.sel{border-color:var(--t1);box-shadow:0 0 0 1px var(--t1)}
.slot:empty{cursor:default}
.goldbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.goldbox small{font-size:11px;color:var(--t3)}
.shop-foot .btn{padding:6px 12px;font-size:13px}
.goldbox b{font-size:17px;font-weight:500;color:var(--gold)}
.foot-note{max-width:1480px;margin:14px auto 0;color:var(--t4);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot-note a{color:var(--t3)}

@media (max-width:980px){
  .shop{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto;min-height:0}
  .classes .seg{flex:1;min-width:0}
  .shop-body{height:70vh}
  .detail{grid-column:1;grid-row:auto;border-left:none;border-top:1px solid var(--line)}
  .d-body{overflow:visible}
}
@media (max-width:560px){
  .shop-body{grid-template-columns:44px minmax(0,1fr)}
  .slot{width:38px;height:38px}
  .inv{order:-1;width:100%;justify-content:center;margin:0 0 4px}
  .goldbox{margin-left:auto}
}
</style>

<div class="page">
  <header class="top">
    <a class="mark" href="./">EHP Shop<small id="patch">Summoner's Rift item shop</small></a>
    <nav class="seg" aria-label="Pages"><a href="./" aria-current="page">Shop</a><a href="analysis.html">Effective health</a></nav>
  </header>
  <div class="loading" id="loading">Loading the shop…</div>
  <section class="shop" id="shop" aria-label="Item shop" hidden>
    <div class="shop-head">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" placeholder="Search items" autocomplete="off" aria-label="Search items"><kbd aria-hidden="true">/</kbd></label>
      <div class="classes">
        <div class="seg" id="classes" role="group" aria-label="Item class"></div>
        <button class="btn sort" id="sort" aria-pressed="false" aria-label="Sort by price, highest first" title="Reverse price order">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
      </div>
    </div>
    <div class="shop-body">
      <nav class="rail" id="rail" aria-label="Filter by stat"></nav>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="detail" aria-label="Selected item">
      <div class="into-wrap"><h3>Builds into</h3><div class="into" id="into"></div></div>
      <div class="d-body" id="detail"></div>
      <div class="buybar"><button class="btn purchase" id="buyBtn" disabled>Purchase</button><div class="d-note" id="note" role="status"></div></div>
    </aside>
    <footer class="shop-foot">
      <button class="btn" id="sellBtn" disabled>Sell</button>
      <button class="btn" id="undoBtn" disabled>Undo</button>
      <div class="inv" id="inv" aria-label="Inventory"></div>
      <div class="goldbox"><small>Build cost</small><b class="num" id="goldTotal">0</b></div>
    </footer>
  </section>
  <p class="foot-note"><span>Double-click an item to buy it. Right-click an item you own, or double-click its inventory slot, to sell it.</span><span>Not endorsed by Riot Games. <a href="analysis.html">See your effective health</a></span></p>
</div>

<script src="core.js"></script>
<script>
(() => {
'use strict';
const { $, $$, esc, fmt, S } = EHP;
let D;
const V = { cls: 'all', filter: null, search: '', desc: false, sel: null, selInv: null };

const CLASSES = [['all','All items'],['fighter','Fighter'],['marksman','Marksman'],['assassin','Assassin'],['mage','Mage'],['tank','Tank'],['support','Support']];
// stat rail, grouped like the in-game one: attack, magic, defense, utility
const FILTERS = [
  [['Attack damage','1036',t => t.includes('Damage')], ['Critical strike','1018',t => t.includes('CriticalStrike')], ['Attack speed','1042',t => t.includes('AttackSpeed')],
   ['On-hit','1043',t => t.includes('OnHit')], ['Armor penetration','3134',t => t.includes('ArmorPenetration')], ['Life steal and omnivamp','1053',t => t.includes('LifeSteal') || t.includes('SpellVamp')]],
  [['Ability power','1052',t => t.includes('SpellDamage')], ['Mana and regen','1027',t => t.includes('Mana') || t.includes('ManaRegen')], ['Magic penetration','4630',t => t.includes('MagicPenetration')]],
  [['Health','1028',t => t.includes('Health')], ['Armor','1029',t => t.includes('Armor')], ['Magic resist','1033',t => t.includes('SpellBlock') || t.includes('MagicResist')]],
  [['Ability haste','3067',t => t.includes('AbilityHaste') || t.includes('CooldownReduction')], ['Movement','1001',t => t.includes('Boots') || t.includes('NonbootsMovement')]],
];
const FLAT = FILTERS.flat();
const SECTIONS = [['starter','Starter'],['boots','Boots'],['basic','Basic'],['epic','Epic'],['legendary','Legendary']];

function build(){
  $('#loading').remove(); $('#shop').hidden = false;
  $('#patch').textContent = `Summoner's Rift item shop, patch ${D.version}`;
  $('#classes').innerHTML = CLASSES.map(([k, n]) => `<button data-cls="${k}" aria-pressed="${k === V.cls}">${n}</button>`).join('');
  let i = 0;
  $('#rail').innerHTML = `<button class="fbtn clear" id="fclear" title="Clear stat filter" aria-label="Clear stat filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button><hr>` +
    FILTERS.map(g => g.map(([n, id]) => `<button class="fbtn" data-f="${i++}" aria-pressed="false" title="${esc(n)}" aria-label="${esc(n)}"><img alt="" src="${D.items[id] ? D.items[id].icon : ''}"></button>`).join('')).join('<hr>');
  wire();
}

function matches(it){
  if (V.cls !== 'all' && !it.classes.has(V.cls)) return false;
  if (V.filter != null && !FLAT[V.filter][2](it.tags)) return false;
  if (V.search){
    const q = V.search.toLowerCase();
    if (!it.name.toLowerCase().includes(q) && !(it.plain || '').toLowerCase().includes(q)) return false;
  }
  return true;
}
function tile(it){
  const owned = S.inv.includes(it.id);
  const blocked = EHP.buyCheck(it.id).err ? ' blocked' : '';
  return `<button class="it${V.sel === it.id ? ' sel' : ''}${owned ? ' owned' : ''}${blocked}" data-id="${it.id}" title="${esc(it.name)}" aria-label="${esc(it.name)}, ${it.gold} gold${owned ? ', owned' : ''}">
    <span class="ic"><img alt="" src="${it.icon}" loading="lazy"></span><span class="g num">${it.gold}</span></button>`;
}
function renderGrid(){
  $$('#classes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cls === V.cls));
  $$('.fbtn[data-f]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.f === V.filter));
  $('#fclear').disabled = V.filter == null;
  const dir = V.desc ? -1 : 1;
  let html = '';
  for (const [cat, title] of SECTIONS){
    const its = Object.values(D.items).filter(i => i.cat === cat && matches(i)).sort((a, b) => dir * (a.gold - b.gold) || a.name.localeCompare(b.name));
    if (!its.length) continue;
    html += `<section class="sec"><h2>${title}<span class="num">${its.length}</span></h2><div class="igrid">${its.map(tile).join('')}</div></section>`;
  }
  $('#grid').innerHTML = html || `<p class="empty">No items match${V.search ? ` “${esc(V.search)}”` : ''}. Clear the search or pick another filter.</p>`;
}

function tree(id, root, depth = 0){
  const it = D.items[id];
  if (!it) return '';
  const kids = depth < 2 ? it.from : [];
  const have = !root && S.inv.includes(id);
  return `<div class="node"><button class="nb${root ? ' root' : ''}${have ? ' have' : ''}" data-id="${id}" title="${esc(it.name)}"><img alt="${esc(it.name)}" src="${it.icon}"><span class="num">${it.gold}</span></button>
    ${kids.length ? `<div class="kids">${kids.map(k => tree(k, false, depth + 1)).join('')}</div>` : ''}</div>`;
}
function renderDetail(){
  const it = V.sel && D.items[V.sel];
  const into = it ? it.into.slice(0, 7) : [];
  $('#into').innerHTML = Array.from({ length: 7 }, (_, i) => {
    const t = into[i] && D.items[into[i]];
    return t ? `<button data-id="${t.id}" title="${esc(t.name)}" aria-label="${esc(t.name)}"><img alt="" src="${t.icon}"></button>` : '<span></span>';
  }).join('');
  const btn = $('#buyBtn');
  if (!it){
    $('#detail').innerHTML = '<p class="d-empty">Pick an item to see its recipe and stats.</p>';
    btn.disabled = true; btn.textContent = 'Purchase'; $('#note').textContent = '';
    return;
  }
  const chk = EHP.buyCheck(it.id);
  const discounted = chk.cost !== it.gold;
  $('#detail').innerHTML = `<div class="tree">${tree(it.id, true)}</div>
    <div><div class="d-name">${esc(it.name)}</div>
      <div class="d-cost num"><span><span class="coin"></span>${discounted ? `${fmt(chk.cost)} <s>${fmt(it.gold)}</s>` : fmt(it.gold)}</span><span class="sellv">Sells for ${fmt(it.sell)}</span></div></div>
    <div class="d-desc">${EHP.descHtml(it.desc)}</div>`;
  btn.disabled = !!chk.err;
  btn.innerHTML = `Purchase<span class="num" style="opacity:.75">${chk.err ? '' : `&nbsp;&nbsp;${fmt(chk.cost)}`}</span>`;
  $('#note').textContent = chk.err || '';
}
function renderInv(){
  $('#inv').innerHTML = S.inv.map((id, i) => {
    const it = id && D.items[id];
    return `<button class="slot${V.selInv === i ? ' sel' : ''}" data-slot="${i}" aria-label="${it ? esc(it.name) + ', slot ' + (i + 1) : 'Empty slot ' + (i + 1)}" title="${it ? esc(it.name) : 'Empty'}">${it ? `<img alt="" src="${it.icon}">` : ''}</button>`;
  }).join('');
  $('#goldTotal').innerHTML = `<span class="coin"></span>${fmt(EHP.buildCost())}`;
  $('#sellBtn').disabled = V.selInv == null;
  $('#undoBtn').disabled = !S.undo.length;
}
const renderAll = () => { renderGrid(); renderDetail(); renderInv(); };

function select(id){ V.sel = id; V.selInv = null; renderAll(); }
function buy(id){
  if (!EHP.buy(id)){ V.sel = id; renderAll(); return; }
  V.selInv = null; renderAll();
}

/* Double-click detection by hand: the first click re-renders the grid, so the second click lands on a
   new element and the browser never fires dblclick. Two clicks on the same item or slot within the
   system-ish double-click window count as one double-click. */
let lastClick = { key: null, t: 0 };
function isDouble(key){
  const now = performance.now();
  const dbl = lastClick.key === key && now - lastClick.t < 550;
  lastClick = dbl ? { key: null, t: 0 } : { key, t: now };
  return dbl;
}

// right-click in the shop: sell the item if you own it, buy it if you don't
function toggle(id){
  const slot = S.inv.lastIndexOf(id);
  if (slot >= 0){ EHP.sell(slot); V.sel = id; V.selInv = null; renderAll(); }
  else buy(id);
}

function wire(){
  $('#shop').addEventListener('click', e => {
    const t = e.target;
    const cb = t.closest('[data-cls]'); if (cb){ V.cls = cb.dataset.cls; renderGrid(); return; }
    const fb = t.closest('.fbtn[data-f]'); if (fb){ V.filter = +fb.dataset.f === V.filter ? null : +fb.dataset.f; renderGrid(); return; }
    if (t.closest('#fclear')){ V.filter = null; renderGrid(); return; }
    if (t.closest('#sort')){ V.desc = !V.desc; const s = $('#sort'); s.setAttribute('aria-pressed', V.desc); s.setAttribute('aria-label', V.desc ? 'Sort by price, lowest first' : 'Sort by price, highest first'); renderGrid(); return; }
    const itb = t.closest('.it, .nb, .into button');
    if (itb){ if (isDouble('i' + itb.dataset.id)) buy(itb.dataset.id); else select(itb.dataset.id); return; }
    if (t.closest('#buyBtn')){ buy(V.sel); return; }
    const sl = t.closest('.slot');
    if (sl){
      const i = +sl.dataset.slot;
      if (S.inv[i] && isDouble('s' + i)){ EHP.sell(i); V.selInv = null; renderAll(); return; }
      if (S.inv[i]){ V.selInv = i; V.sel = S.inv[i]; } else V.selInv = null;
      renderAll(); return;
    }
    if (t.closest('#sellBtn') && V.selInv != null){ EHP.sell(V.selInv); V.selInv = null; renderAll(); return; }
    if (t.closest('#undoBtn')){ EHP.undo(); V.selInv = null; renderAll(); return; }
  });
  $('#shop').addEventListener('contextmenu', e => {
    const it = e.target.closest('.it, .nb, .into button');
    if (it){ e.preventDefault(); toggle(it.dataset.id); return; }
    const sl = e.target.closest('.slot');
    if (sl){ e.preventDefault(); const i = +sl.dataset.slot; if (S.inv[i]){ EHP.sell(i); V.selInv = null; renderAll(); } }
  });
  $('#shop').addEventListener('mousedown', e => { if (e.detail > 1 && e.target.closest('.it, .nb, .into button, .slot')) e.preventDefault(); }); // no text selection on double-click
  $('#search').addEventListener('input', e => { V.search = e.target.value.trim(); renderGrid(); });
  $('#search').addEventListener('keydown', e => { if (e.key === 'Escape'){ e.target.value = ''; V.search = ''; renderGrid(); } });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#search')){ e.preventDefault(); $('#search').focus(); }
  });
}

EHP.onSync = renderAll;
EHP.load().then(d => { D = d; V.sel = S.inv.find(Boolean) || null; build(); renderAll(); })
  .catch(err => { $('#loading').textContent = `Couldn't load the item data (${err.message}). Reload the page to try again.`; });
})();
</script>
